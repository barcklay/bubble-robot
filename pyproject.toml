[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bubble-robot"
version = "0.1.0"
description = "Bubble Robot — Flying Companion MVP"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "pygame>=2.6",
]

[project.optional-dependencies]
vision = ["opencv-python>=4.8", "numpy"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["bubble_robot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
